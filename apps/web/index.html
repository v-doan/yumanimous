<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets us paint under the notch; safe-area insets in CSS keep content clear of it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FBFAF7" />
    <meta name="description" content="Swipe to decide what to eat, together." />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!--
      Installable (Add to Home Screen) via the manifest alone. There is deliberately no
      service worker: every screen needs the live socket, so offline caching would add
      nothing, and a caching worker is the usual cause of stale versions after a deploy.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Yumanimous" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Yumanimous</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
