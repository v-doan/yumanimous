# Local development database. `npm run db:up` starts it; data survives restarts
# in the named volume. Credentials are dev-only and match .env.example.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: yumanimous
      POSTGRES_PASSWORD: yumanimous
      POSTGRES_DB: yumanimous
    ports:
      - '5432:5432'
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql (not .../data).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U yumanimous']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
