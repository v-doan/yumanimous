# Weekly update PRs for dependencies, pinned actions and the base image. Security
# updates also arrive as soon as an advisory is published (enable "Dependabot
# security updates" in the repo settings).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Let new releases age a week before proposing them: most malicious package
    # versions are caught and pulled within days.
    cooldown:
      default-days: 7
    groups:
      dev-tools:
        dependency-type: development
      runtime:
        dependency-type: production
    # Major versions are deliberate upgrades, not weekly bumps: @types/node must match
    # the Node 22 runtime, and TypeScript 7 (a new compiler) needs the lint tooling to
    # support it first. Security fixes still arrive.
    ignore:
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Same Node major as .nvmrc and CI; a new major is a deliberate upgrade.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
